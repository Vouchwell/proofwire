name: Release

# Publishing from CI rather than a laptop, for three reasons that matter for a
# security product: the artifact is built from a tagged commit anyone can
# inspect, npm records provenance attestations linking each tarball to this
# workflow run, and no long-lived credential sits on a developer machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only, publish nothing'
        type: boolean
        default: true
      tag:
        description: >-
          Finish the release of an existing tag (e.g. v0.6.0): build from that
          tag, skip what npm already has, then PyPI and the GitHub release.
          Empty: a preflight of main.
        type: string
        default: ''

# The tag being released: the pushed one, or the one named when finishing a
# release by hand. Empty for a plain dry run of main.
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}

# Read-only by default; the publish job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The suite replays witnesses/keys.json's whole history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          VOUCHWELL_ACCESS_LOG: 'off'
          VOUCHWELL_INSECURE_COOKIES: '1'
      - run: npm run demo

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # write, because the last step creates the GitHub release.
      contents: write
      # Required for npm provenance: the tarball is signed against this run,
      # so anyone can check which commit and workflow produced it.
      id-token: write
    env:
      # Whether an NPM_TOKEN secret exists, as a flag of its own. Branching on
      # NODE_AUTH_TOKEN does not work: actions/setup-node sets it to a
      # placeholder (XXXXX-XXXXX-XXXXX-XXXXX) when no token is configured, so it
      # is never empty — which is how the 0.3.0 tag push ran Publish without a
      # token. Without one, a release is published from a maintainer's machine
      # (`npm run release`, with a 2FA code) and only then tagged; see
      # docs/PUBLISHING.md.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --no-audit --no-fund

      - name: Confirm the tag matches the manifests
        if: env.RELEASE_TAG != ''
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package version $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: Is this version already on npm?
        # Checked here rather than left to release.js: when finishing a tag,
        # the checkout is that tag, and its release.js may predate --resume.
        # Anonymous, and not through npm: setup-node's .npmrc sends its
        # placeholder token, which the registry can answer with a 401.
        id: npm
        if: env.RELEASE_TAG != ''
        run: |
          V="${RELEASE_TAG#v}"
          all=true
          for p in packages/*/package.json; do
            [ "$(node -p "require('./$p').private === true")" = true ] && continue
            n="$(node -p "require('./$p').name")"
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${n/\//%2f}/$V")"
            echo "$n@$V: HTTP $status"
            [ "$status" = 200 ] || all=false
          done
          echo "published=$all" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true' && steps.npm.outputs.published != 'true'
        # --resume: a version already wholly on npm (published by hand, or by
        # an earlier attempt) is done, not an error.
        run: node scripts/release.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ env.RELEASE_TAG != '' && '--resume' || '' }} --skip-tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attach provenance to every tarball.
          NPM_CONFIG_PROVENANCE: true

      - name: Or confirm it was already published by hand
        # A GitHub release says "this version exists"; it only gets made if
        # every package at the tagged version is genuinely on npm.
        if: env.HAS_NPM_TOKEN != 'true' && env.RELEASE_TAG != ''
        run: |
          V="${RELEASE_TAG#v}"
          missing=0
          for p in packages/*/package.json; do
            [ "$(node -p "require('./$p').private === true")" = true ] && continue
            n="$(node -p "require('./$p').name")"
            # Anonymous, and not through npm: setup-node's .npmrc sends its
            # placeholder token, which the registry can answer with a 401.
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${n/\//%2f}/$V")"
            if [ "$status" = 200 ]; then
              echo "on npm: $n@$V"
            else
              echo "::error::$n@$V is not on npm"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "::error::Publish $V first (npm run release), then push the tag — or add an NPM_TOKEN secret."
            exit 1
          fi

      - name: Create the GitHub release
        if: env.RELEASE_TAG != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${RELEASE_TAG#v}"
          # This version's section of CHANGELOG.md, written by a person, over
          # notes generated from commit titles.
          awk -v v="$V" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Vouchwell $V" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Vouchwell $V" --generate-notes
          fi

  pypi:
    # The Python SDK, at the same version, after npm succeeded. Trusted
    # publishing: PyPI accepts this upload because GitHub vouches it comes
    # from this workflow in this repository, so no PyPI token is stored
    # anywhere. Configured once on PyPI; see docs/PUBLISHING.md.
    needs: publish
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vouchwell
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Confirm the tag matches the Python package
        run: |
          TAG="${RELEASE_TAG#v}"
          PY=$(sed -n 's/^version = "\(.*\)"$/\1/p' sdk/python/pyproject.toml)
          INIT=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sdk/python/src/vouchwell/__init__.py)
          if [ "$TAG" != "$PY" ] || [ "$TAG" != "$INIT" ]; then
            echo "::error::tag $TAG, pyproject.toml $PY, __init__.py $INIT: all three must agree"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build sdk/python --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
